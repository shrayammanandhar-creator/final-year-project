{% extends "base.html" %}

{% block title %}NepWears | Sign Up{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title mb-3">Create account</h3>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-warning w-100" type="submit">Sign Up</button>
          </form>
          <div class="mt-3 small text-muted">
            Already have an account? <a href="{% url 'users:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Sign in</a>.
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
